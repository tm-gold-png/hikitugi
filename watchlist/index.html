<style>

<body>
<section id="loginScreen" class="login">
  <div class="login-card">
    <h1>要注意人物・写真共有ボード</h1>
    <p>引継ぎアプリと同じ端末IDでログインします。<br>例：GOLD01 ～ GOLD10</p>
    <label for="loginId">端末ID</label>
    <input id="loginId" autocomplete="username" placeholder="GOLD01">
    <label for="loginPw">認証キー / パスワード</label>
    <input id="loginPw" type="password" autocomplete="current-password" placeholder="パスワード">
    <button id="loginBtn" class="btn primary wide">ログイン</button>
    <div id="loginError" class="error"></div>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <div class="head">
      <div class="head-title"><div><h1>要注意人物・写真共有ボード</h1><div class="sub">項目ごとにコメント・複数写真を共有</div></div></div>
      <div class="head-actions">
        <span id="deviceBadge" class="device"></span>
        <span class="version">Ver 2026.10.14.10</span>
        <span id="uploadBadge" class="upload-badge hidden">写真保存中</span>
        <button id="logoutBtn" class="btn ghost">ログアウト</button>
      </div>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <input id="searchInput" class="search" type="search" placeholder="項目・コメントを検索">
    </div>
    <div class="preset-row" aria-label="表示する項目">
      <button class="preset-btn" data-filter="要注意人物">要注意人物</button>
      <button class="preset-btn" data-filter="未成年">未成年</button>
      <button class="preset-btn" data-filter="忘れ物">忘れ物</button>
      <button class="preset-btn" data-filter="出入り禁止">出入り禁止</button>
      <button class="preset-btn" data-filter="ロイヤルカスタマー">ロイヤルカスタマー</button>
    </div>
    <div class="category-actions">
      <div id="categoryStatus" class="category-status">表示中：すべて</div>
      <div class="category-action-buttons">
        <button id="showAllBtn" class="btn ghost" type="button">すべて表示</button>
        <button id="newItemBtn" class="btn primary" type="button">＋ 新規登録</button>
      </div>
    </div>
    <div class="counter"><b id="visibleCount">0</b> / <span id="totalCount">0</span>件</div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden">まだ登録がありません。<br>上の5つの項目ボタンから登録してください。</div>
  </main>
</div>

<div id="itemModal" class="modal hidden">
  <div class="panel">
    <h2 id="itemModalTitle">項目を追加</h2>
    <form id="itemForm">
      <input id="itemId" type="hidden">
      <label for="itemName">項目</label>
      <select id="itemName" required>
        <option value="要注意人物">要注意人物</option>
        <option value="未成年">未成年</option>
        <option value="忘れ物">忘れ物</option>
        <option value="出入り禁止">出入り禁止</option>
        <option value="ロイヤルカスタマー">ロイヤルカスタマー</option>
      </select>
      <label for="commentInput">コメント</label>
      <textarea id="commentInput" maxlength="5000" placeholder="特徴・確認内容・注意点など"></textarea>
      <div id="initialPhotoArea">
        <label for="initialPhotos">写真（任意・複数選択可）</label>
        <input id="initialPhotos" class="file" type="file" accept="image/*" multiple>
        <div class="hint">項目だけ先に作成し、あとから写真を追加することもできます。</div>
        <div id="initialPreview" class="preview-grid"></div>
      </div>
      <div class="actions">
        <button id="itemCancelBtn" type="button" class="btn ghost">キャンセル</button>
        <button id="itemSaveBtn" type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div id="photoModal" class="modal hidden">
  <div class="panel">
    <h2>写真をアップロード</h2>
    <p id="photoTargetName" class="hint"></p>
    <input id="photoUploadInput" class="file" type="file" accept="image/*" multiple>
    <div class="hint">複数枚をまとめて選択できます。写真は自動圧縮して保存します。</div>
    <div id="photoUploadPreview" class="preview-grid"></div>
    <div class="actions">
      <button id="photoCancelBtn" type="button" class="btn ghost">キャンセル</button>
      <button id="photoUploadBtn" type="button" class="btn primary">写真を保存</button>
    </div>
  </div>
</div>

<div id="detail" class="detail hidden">
  <button id="detailClose" class="detail-close">×</button>
  <div class="detail-photo">
    <button id="prevPhoto" class="nav-btn nav-prev">‹</button>
    <img id="detailImg" alt="登録写真">
    <div id="detailNoPhoto" class="no-photo hidden">写真がありません</div>
    <button id="nextPhoto" class="nav-btn nav-next">›</button>
    <div id="detailCount" class="detail-count"></div>
  </div>
  <div class="detail-side">
    <h2 id="detailTitle"></h2>
    <div id="detailMeta" class="detail-meta"></div>
    <div id="detailComment" class="detail-comment"></div>
    <div class="detail-actions">
      <button id="detailAddPhotoBtn" class="btn primary">＋ 写真アップ</button>
      <button id="editBtn" class="btn ghost">項目編集</button>
      <button id="deleteBtn" class="btn danger">項目削除</button>
    </div>
    <div class="photos-list">
      <h3>登録写真</h3>
      <div id="miniGrid" class="mini-grid"></div>
    </div>
  </div>
</div>

<div id="loading" class="loading hidden">処理中...</div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, serverTimestamp, query, orderBy, onSnapshot, where, documentId } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
import { getStorage, ref as storageRef, uploadBytes, getBlob, deleteObject } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js';

const VERSION='2026.10.14.10';
const META_COLLECTION='appState';
const DOC_PREFIX='watchlistSimple_v2_';
const LEGACY_COLLECTION='watchlistSimple';
const STORAGE_PREFIX='handover_photos/watchlistSimple';
const firebaseConfig={
  apiKey:'AIzaSyA241WcXSucsjoixxyXVSygGeiHvF8J1d0',
  authDomain:'gold-cee80.firebaseapp.com',
  projectId:'gold-cee80',
  storageBucket:'gold-cee80.firebasestorage.app',
  messagingSenderId:'4380559169',
  appId:'1:4380559169:web:3e8192da6dd8c0dd7983c0',
  measurementId:'G-ZXWGV19DG9'
};
const firebaseApp=initializeApp(firebaseConfig,'watchlistSimpleApp');
const auth=getAuth(firebaseApp); const db=getFirestore(firebaseApp); const storage=getStorage(firebaseApp);
const $=id=>document.getElementById(id);
const el={
  loginScreen:$('loginScreen'),loginId:$('loginId'),loginPw:$('loginPw'),loginBtn:$('loginBtn'),loginError:$('loginError'),
  app:$('app'),deviceBadge:$('deviceBadge'),logoutBtn:$('logoutBtn'),searchInput:$('searchInput'),grid:$('grid'),empty:$('empty'),totalCount:$('totalCount'),visibleCount:$('visibleCount'),categoryStatus:$('categoryStatus'),showAllBtn:$('showAllBtn'),newItemBtn:$('newItemBtn'),
  itemModal:$('itemModal'),itemModalTitle:$('itemModalTitle'),itemForm:$('itemForm'),itemId:$('itemId'),itemName:$('itemName'),commentInput:$('commentInput'),initialPhotoArea:$('initialPhotoArea'),initialPhotos:$('initialPhotos'),initialPreview:$('initialPreview'),itemCancelBtn:$('itemCancelBtn'),itemSaveBtn:$('itemSaveBtn'),
  photoModal:$('photoModal'),photoTargetName:$('photoTargetName'),photoUploadInput:$('photoUploadInput'),photoUploadPreview:$('photoUploadPreview'),photoCancelBtn:$('photoCancelBtn'),photoUploadBtn:$('photoUploadBtn'),
  detail:$('detail'),detailClose:$('detailClose'),detailImg:$('detailImg'),detailNoPhoto:$('detailNoPhoto'),detailTitle:$('detailTitle'),detailMeta:$('detailMeta'),detailComment:$('detailComment'),detailCount:$('detailCount'),prevPhoto:$('prevPhoto'),nextPhoto:$('nextPhoto'),detailAddPhotoBtn:$('detailAddPhotoBtn'),editBtn:$('editBtn'),deleteBtn:$('deleteBtn'),miniGrid:$('miniGrid'),loading:$('loading'),toast:$('toast'),uploadBadge:$('uploadBadge')
};
let records=[]; let primaryRecords=[]; let legacyRecords=[]; let unsubscribe=null; let legacyUnsubscribe=null; let currentId=null; let detailPhotoIndex=0; let toastTimer=null; let observer=null; let categoryFilter=''; const urlCache=new Map();
const pendingUploads=new Map();

function normalizeLoginId(raw){const v=String(raw||'').trim();if(!v)return'';if(v.includes('@'))return v.toLowerCase();const n=v.toLowerCase().replace(/[^a-z0-9._-]/g,'');return n?n+'@store-device.local':'';}
function displayLoginId(email){const e=String(email||'');return e.endsWith('@store-device.local')?e.slice(0,-'@store-device.local'.length).toUpperCase():e;}
function friendlyAuth(err){const c=err?.code||'';if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')||c.includes('invalid-email'))return'端末IDまたは認証キーが違います。';if(c.includes('too-many-requests'))return'ログイン試行が多すぎます。しばらくしてから再度お試しください。';if(c.includes('network-request-failed'))return'インターネット接続を確認してください。';return'ログインできませんでした。';}
function loading(on,text='処理中...'){el.loading.textContent=text;el.loading.classList.toggle('hidden',!on)}
function toast(msg){clearTimeout(toastTimer);el.toast.textContent=msg;el.toast.classList.add('show');toastTimer=setTimeout(()=>el.toast.classList.remove('show'),2300)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalize(s=''){return String(s).toLowerCase().replace(/\s+/g,' ').trim()}
function dateText(ts){try{const d=ts?.toDate?ts.toDate():new Date(ts);if(Number.isNaN(d.getTime()))return'';return new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d)}catch{return''}}
function tsMillis(ts){try{const d=ts?.toDate?ts.toDate():new Date(ts);const n=d.getTime();return Number.isFinite(n)?n:0}catch{return 0}}
function uniqueId(){return (globalThis.crypto?.randomUUID?.()||(`${Date.now()}_${Math.random().toString(36).slice(2)}`)).replace(/[^a-zA-Z0-9_-]/g,'')}
function photoPathsOf(r){const arr=Array.isArray(r.photoPaths)?r.photoPaths.filter(x=>typeof x==='string'&&x):[];if(!arr.length&&r.photoPath)arr.push(r.photoPath);return [...new Set(arr)]}
function titleOf(r){return String(r.itemName||r.title||'登録項目').trim()||'登録項目'}
function recordById(id){return records.find(x=>x.id===id)}
function itemDocRef(r){return r?doc(db,r._source==='legacy'?LEGACY_COLLECTION:META_COLLECTION,r.id):null}
function rebuildRecords(){const m=new Map();for(const r of legacyRecords)m.set('legacy:'+r.id,r);for(const r of primaryRecords)m.set('primary:'+r.id,r);records=[...m.values()].sort((a,b)=>tsMillis(b.createdAt)-tsMillis(a.createdAt));render();if(!el.detail.classList.contains('hidden')&&currentId){const r=recordById(currentId);if(r)refreshDetail(r);else closeDetail()}}
async function allowedDevice(user){if(!user)return false;const snap=await getDoc(doc(db,'allowedDevices',user.uid));return snap.exists()&&snap.data()?.enabled===true;}
async function showApp(user){el.loginScreen.classList.add('hidden');el.app.classList.remove('hidden');el.deviceBadge.textContent=displayLoginId(user.email||'');subscribe();}
function showLogin(message=''){if(unsubscribe){unsubscribe();unsubscribe=null}if(legacyUnsubscribe){legacyUnsubscribe();legacyUnsubscribe=null}records=[];primaryRecords=[];legacyRecords=[];render();el.app.classList.add('hidden');el.loginScreen.classList.remove('hidden');el.loginError.textContent=message;el.loginPw.value='';}
async function login(){el.loginError.textContent='';const email=normalizeLoginId(el.loginId.value);if(!email||!el.loginPw.value){el.loginError.textContent='端末IDと認証キーを入力してください。';return}el.loginBtn.disabled=true;try{await setPersistence(auth,browserLocalPersistence);const cred=await signInWithEmailAndPassword(auth,email,el.loginPw.value);if(!(await allowedDevice(cred.user))){await signOut(auth);el.loginError.textContent='この端末アカウントは利用許可されていません。';}}catch(err){el.loginError.textContent=friendlyAuth(err)}finally{el.loginBtn.disabled=false}}

function subscribe(){
  if(unsubscribe)unsubscribe();
  if(legacyUnsubscribe)legacyUnsubscribe();
  const q=query(collection(db,META_COLLECTION),where(documentId(),'>=',DOC_PREFIX),where(documentId(),'<',DOC_PREFIX+'\uf8ff'));
  unsubscribe=onSnapshot(q,s=>{primaryRecords=s.docs.map(d=>({id:d.id,_source:'primary',...d.data()}));rebuildRecords()},err=>{console.error('watchlist appState read failed',err);toast('共有データを読み込めません')});
  try{
    const lq=query(collection(db,LEGACY_COLLECTION),orderBy('createdAt','desc'));
    legacyUnsubscribe=onSnapshot(lq,s=>{legacyRecords=s.docs.map(d=>({id:d.id,_source:'legacy',...d.data()}));rebuildRecords()},err=>{console.warn('legacy watchlist read skipped',err?.code||err);legacyRecords=[];rebuildRecords()});
  }catch(err){console.warn('legacy watchlist subscribe skipped',err)}
}
function filtered(){const q=normalize(el.searchInput.value);return records.filter(r=>{if(categoryFilter&&titleOf(r)!==categoryFilter)return false;if(q&&!normalize(`${titleOf(r)} ${r.comment||''} ${r.createdByLabel||''}`).includes(q))return false;return true;});}
function setCategoryFilter(category=''){categoryFilter=String(category||'');document.querySelectorAll('[data-filter]').forEach(btn=>btn.classList.toggle('active',btn.dataset.filter===categoryFilter));if(el.categoryStatus)el.categoryStatus.textContent='表示中：'+(categoryFilter||'すべて');render();}
function selectedCategoryForNew(){return categoryFilter||'要注意人物';}
function pendingOf(id){return pendingUploads.get(id)||[]}
function remoteUploadPending(r){return String(r?.photoUploadStatus||'')==='uploading'&&Math.max(0,Number(r?.photoUploadPendingCount||0))>0}
function refreshUploadBadge(){const count=[...pendingUploads.values()].reduce((n,a)=>n+a.length,0);el.uploadBadge?.classList.toggle('hidden',count===0);if(el.uploadBadge)el.uploadBadge.textContent=count?`写真保存中 ${count}枚`:'写真保存中'}
function queuePendingPreviews(itemId,files){const entries=files.map(file=>({file,url:URL.createObjectURL(file)}));const current=pendingOf(itemId);pendingUploads.set(itemId,current.concat(entries));refreshUploadBadge();render();return entries}
function clearPendingEntries(itemId,entries){const current=pendingOf(itemId);const remove=new Set(entries);for(const e of entries){try{URL.revokeObjectURL(e.url)}catch{}}const remain=current.filter(e=>!remove.has(e));if(remain.length)pendingUploads.set(itemId,remain);else pendingUploads.delete(itemId);refreshUploadBadge();render()}
function displayPhotosOf(r){return [...photoPathsOf(r).map(path=>({kind:'cloud',path})),...pendingOf(r.id).map(x=>({kind:'pending',url:x.url}))]}
function render(){const list=filtered();el.totalCount.textContent=records.length;el.visibleCount.textContent=list.length;const hasFilter=!!categoryFilter||!!el.searchInput.value.trim();el.empty.classList.toggle('hidden',records.length!==0||hasFilter);if(records.length&&list.length===0){el.grid.innerHTML='<div class="empty">この項目には登録がありません。</div>';return}el.grid.innerHTML=list.map(r=>{const photos=photoPathsOf(r),pend=pendingOf(r.id),count=photos.length+pend.length;const remoteSaving=remoteUploadPending(r);const saving=pend.length>0||remoteSaving;const preview=pend.length?pend[pend.length-1].url:'';const photoHtml=count?(preview?`<img src="${esc(preview)}" alt="保存中の写真">`:`<img class="lazy" data-path="${esc(photos[0])}" alt="登録写真">`):(remoteSaving?'<span class="no-photo">写真保存中…</span>':'<span class="no-photo">写真なし</span>');return `<article class="card" data-id="${esc(r.id)}"><div class="thumb" data-open="detail">${photoHtml}${count?`<span class="photo-count">写真 ${count}</span>`:''}${saving?'<span class="sync-badge">保存中</span>':''}</div><div class="card-body"><div class="item-title">${esc(titleOf(r))}</div><div class="comment">${esc(r.comment||'コメントなし')}</div><div class="meta"><span>${esc(r.createdByLabel||'')}</span><span>${esc(dateText(r.createdAt))}</span></div></div><div class="card-actions"><button class="btn primary" data-action="photo">＋ 写真アップ</button><button class="btn danger" data-action="delete">削除</button></div></article>`}).join('');
  el.grid.querySelectorAll('.card').forEach(card=>{const id=card.dataset.id;card.querySelector('[data-open=detail]')?.addEventListener('click',()=>openDetail(id));card.querySelector('[data-action=photo]')?.addEventListener('click',()=>openPhotoModal(id));card.querySelector('[data-action=delete]')?.addEventListener('click',()=>removeItem(id));});setupLazy();}
async function objectUrl(path){if(urlCache.has(path))return urlCache.get(path);const blob=await getBlob(storageRef(storage,path),8*1024*1024);const url=URL.createObjectURL(blob);urlCache.set(path,url);return url;}
function setupLazy(){if(observer)observer.disconnect();const imgs=[...el.grid.querySelectorAll('img.lazy')];if(!('IntersectionObserver'in window)){imgs.forEach(async i=>{try{i.src=await objectUrl(i.dataset.path)}catch{}});return}observer=new IntersectionObserver(entries=>entries.forEach(async e=>{if(!e.isIntersecting)return;observer.unobserve(e.target);try{e.target.src=await objectUrl(e.target.dataset.path)}catch{}}),{rootMargin:'250px'});imgs.forEach(i=>observer.observe(i));}

function revokePreviewImages(root){root.querySelectorAll('img[data-object-url]').forEach(img=>{try{URL.revokeObjectURL(img.dataset.objectUrl)}catch{}});root.innerHTML='';}
function renderLocalPreviews(input,root){revokePreviewImages(root);[...(input.files||[])].slice(0,12).forEach(file=>{const url=URL.createObjectURL(file);const img=document.createElement('img');img.src=url;img.dataset.objectUrl=url;img.alt='選択写真';root.appendChild(img)});}
function ensureCategoryOption(value){const v=String(value||'').trim();if(!v)return;if(![...el.itemName.options].some(o=>o.value===v)){const o=document.createElement('option');o.value=v;o.textContent=v+'（既存）';el.itemName.appendChild(o)}}
function openAddItem(preset){currentId=null;el.itemForm.reset();el.itemId.value='';const category=String(preset||'要注意人物');ensureCategoryOption(category);el.itemName.value=category;el.itemModalTitle.textContent=category+'を登録';el.initialPhotoArea.classList.remove('hidden');revokePreviewImages(el.initialPreview);el.itemModal.classList.remove('hidden');setTimeout(()=>el.commentInput.focus(),100)}
function openEditItem(id){const r=recordById(id);if(!r)return;currentId=id;el.itemForm.reset();el.itemId.value=id;const category=titleOf(r);ensureCategoryOption(category);el.itemName.value=category;el.commentInput.value=r.comment||'';el.itemModalTitle.textContent='登録内容を編集';el.initialPhotoArea.classList.add('hidden');revokePreviewImages(el.initialPreview);el.itemModal.classList.remove('hidden');setTimeout(()=>el.commentInput.focus(),100)}
function closeItemModal(){el.itemModal.classList.add('hidden');revokePreviewImages(el.initialPreview)}

async function compressImage(file){
  let img=null,objectUrl='';
  try{
    if('createImageBitmap' in window){
      try{img=await createImageBitmap(file,{imageOrientation:'from-image'})}catch{img=null}
    }
    if(!img){
      objectUrl=URL.createObjectURL(file);
      img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=objectUrl});
    }
    let w=img.width,h=img.height;
    const scale=Math.min(1,1200/Math.max(w,h));
    w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('画像圧縮に失敗しました')),'image/jpeg',.70));
  }finally{
    try{if(img?.close)img.close()}catch{}
    if(objectUrl)try{URL.revokeObjectURL(objectUrl)}catch{}
  }
}
async function uploadFiles(itemId,files){
  const paths=new Array(files.length);const failures=[];let next=0;
  const workerCount=Math.min(3,Math.max(1,files.length));
  async function worker(){
    while(true){
      const idx=next++;if(idx>=files.length)return;
      try{
        const blob=await compressImage(files[idx]);
        const path=`${STORAGE_PREFIX}/${itemId}_${uniqueId()}.jpg`;
        await uploadBytes(storageRef(storage,path),blob,{contentType:'image/jpeg',cacheControl:'private,max-age=86400'});
        paths[idx]=path;
      }catch(err){console.error('photo upload failed',err);failures.push({index:idx,error:err})}
    }
  }
  await Promise.all(Array.from({length:workerCount},()=>worker()));
  return {paths:paths.filter(Boolean),failures};
}
function startBackgroundPhotoUpload(itemId,files){
  if(!files.length)return;
  const pendingEntries=queuePendingPreviews(itemId,files);
  const uploadToken=uniqueId();
  toast(`${files.length}枚の写真を保存中です。画面はそのまま操作できます。`);
  (async()=>{
    let uploaded=[];
    let result={paths:[],failures:[]};
    try{
      const before=recordById(itemId);
      if(before){
        try{
          await updateDoc(itemDocRef(before),{photoUploadStatus:'uploading',photoUploadPendingCount:files.length,photoUploadToken:uploadToken,photoUploadStartedAt:serverTimestamp(),updatedAt:serverTimestamp(),updatedBy:auth.currentUser?.email||'',version:VERSION});
        }catch(err){console.warn('upload status sync failed',err)}
      }
      result=await uploadFiles(itemId,files);uploaded=result.paths;
      const latest=recordById(itemId);if(!latest)throw new Error('record-not-found');
      const currentPaths=photoPathsOf(latest);
      await updateDoc(itemDocRef(latest),{photoPaths:[...new Set([...currentPaths,...uploaded])],photoUploadStatus:'',photoUploadPendingCount:0,photoUploadToken:'',photoUploadCompletedAt:serverTimestamp(),updatedAt:serverTimestamp(),updatedBy:auth.currentUser?.email||'',version:VERSION});
      clearPendingEntries(itemId,pendingEntries);
      if(result.failures.length)toast(`${uploaded.length}枚保存・${result.failures.length}枚は保存できませんでした`);else toast(`${uploaded.length}枚の写真を保存しました`);
    }catch(err){
      console.error(err);clearPendingEntries(itemId,pendingEntries);
      const latest=recordById(itemId);
      if(latest){try{await updateDoc(itemDocRef(latest),{photoUploadStatus:'',photoUploadPendingCount:0,photoUploadToken:'',photoUploadFailedAt:serverTimestamp(),updatedAt:serverTimestamp(),version:VERSION})}catch{}}
      for(const p of uploaded){try{await deleteObject(storageRef(storage,p))}catch{}}
      toast('写真の保存に失敗しました。もう一度お試しください。');
    }
  })();
}
async function saveItem(e){
  e.preventDefault();const id=el.itemId.value.trim();const itemName=el.itemName.value.trim();const comment=el.commentInput.value.trim();if(!itemName){toast('項目を選択してください');return}
  el.itemSaveBtn.disabled=true;
  try{
    if(id){
      const current=recordById(id);if(!current){toast('更新対象が見つかりません');return}
      loading(true,'項目を更新中...');await updateDoc(itemDocRef(current),{itemName,comment,updatedAt:serverTimestamp(),updatedBy:auth.currentUser?.email||'',version:VERSION});toast('項目を更新しました');closeItemModal();return;
    }
    const newId=DOC_PREFIX+uniqueId();const refDoc=doc(db,META_COLLECTION,newId);const files=[...(el.initialPhotos.files||[])];
    const optimistic={id:newId,_source:'primary',itemName,comment,photoPaths:[],photoUploadStatus:files.length?'uploading':'',photoUploadPendingCount:files.length,createdAt:new Date(),updatedAt:new Date(),createdBy:auth.currentUser?.email||'',createdByLabel:displayLoginId(auth.currentUser?.email||''),version:VERSION};
    primaryRecords=[optimistic,...primaryRecords.filter(x=>x.id!==newId)];rebuildRecords();closeItemModal();toast(files.length?'登録しました。写真はバックグラウンドで保存します。':'項目を登録しました');
    try{
      await setDoc(refDoc,{itemName,comment,photoPaths:[],photoUploadStatus:files.length?'uploading':'',photoUploadPendingCount:files.length,photoUploadStartedAt:files.length?serverTimestamp():null,app:'watchlistSimple',createdAt:serverTimestamp(),updatedAt:serverTimestamp(),createdBy:auth.currentUser?.email||'',createdByLabel:displayLoginId(auth.currentUser?.email||''),version:VERSION});
      if(files.length)startBackgroundPhotoUpload(newId,files);
    }catch(err){primaryRecords=primaryRecords.filter(x=>x.id!==newId);rebuildRecords();console.error(err);const code=String(err?.code||'');alert(code.includes('permission-denied')?'項目の保存権限がありません。Firebaseの既存 appState ルールを確認してください。':'項目の保存に失敗しました。\n'+(err?.message||err));}
  }finally{loading(false);el.itemSaveBtn.disabled=false}
}
function openPhotoModal(id){const r=recordById(id);if(!r)return;currentId=id;el.photoUploadInput.value='';revokePreviewImages(el.photoUploadPreview);el.photoTargetName.textContent=`追加先：${titleOf(r)}`;el.photoModal.classList.remove('hidden')}
function closePhotoModal(){el.photoModal.classList.add('hidden');el.photoUploadInput.value='';revokePreviewImages(el.photoUploadPreview)}
function uploadPhotosToCurrent(){const r=recordById(currentId);if(!r)return;const files=[...(el.photoUploadInput.files||[])];if(!files.length){toast('写真を選択してください');return}const id=r.id;closePhotoModal();startBackgroundPhotoUpload(id,files)}

async function openDetail(id,startIndex=0){const r=recordById(id);if(!r)return;currentId=id;detailPhotoIndex=Math.max(0,startIndex);el.detail.classList.remove('hidden');document.body.style.overflow='hidden';await refreshDetail(r)}
async function refreshDetail(r){const photos=displayPhotosOf(r);const saving=pendingOf(r.id).length>0||remoteUploadPending(r);if(detailPhotoIndex>=photos.length)detailPhotoIndex=Math.max(0,photos.length-1);el.detailTitle.textContent=titleOf(r);el.detailComment.textContent=r.comment||'コメントなし';el.detailMeta.textContent=[r.createdByLabel,dateText(r.createdAt),saving?'写真保存中':''].filter(Boolean).join(' ・ ');el.detailImg.removeAttribute('src');el.detailNoPhoto.textContent=saving?'写真保存中…':'写真がありません';el.detailNoPhoto.classList.toggle('hidden',photos.length>0);el.detailImg.classList.toggle('hidden',photos.length===0);el.prevPhoto.classList.toggle('hidden',photos.length<=1);el.nextPhoto.classList.toggle('hidden',photos.length<=1);el.detailCount.textContent=photos.length?`${detailPhotoIndex+1} / ${photos.length}`:(saving?'写真保存中…':'写真 0枚');el.miniGrid.innerHTML='';if(photos.length){const first=photos[detailPhotoIndex];try{el.detailImg.src=first.kind==='pending'?first.url:await objectUrl(first.path)}catch{toast('写真を読み込めません')}for(let i=0;i<photos.length;i++){const p=photos[i];const div=document.createElement('div');div.className='mini';div.dataset.index=String(i);div.innerHTML=`<img alt="登録写真">${p.kind==='cloud'?'<button class="mini-del" title="この写真を削除">×</button>':'<span class="sync-badge">保存中</span>'}`;div.addEventListener('click',e=>{if(e.target.closest('.mini-del'))return;detailPhotoIndex=i;refreshDetail(r)});if(p.kind==='cloud'){div.querySelector('.mini-del').addEventListener('click',e=>{e.stopPropagation();removePhoto(r.id,p.path)});objectUrl(p.path).then(url=>{const img=div.querySelector('img');if(img)img.src=url}).catch(()=>{})}else{div.querySelector('img').src=p.url}el.miniGrid.appendChild(div)}}else{el.miniGrid.innerHTML=`<div class="hint" style="grid-column:1/-1">${saving?'写真を保存中です。完了後に自動表示されます。':'写真はまだありません。'}</div>`}}
function closeDetail(){el.detail.classList.add('hidden');el.detailImg.removeAttribute('src');document.body.style.overflow='';currentId=null;detailPhotoIndex=0}
function stepPhoto(delta){const r=recordById(currentId);if(!r)return;const photos=displayPhotosOf(r);if(photos.length<=1)return;detailPhotoIndex=(detailPhotoIndex+delta+photos.length)%photos.length;refreshDetail(r)}
async function removePhoto(itemId,path){const r=recordById(itemId);if(!r)return;if(!confirm('この写真だけを削除しますか？'))return;loading(true,'写真を削除中...');try{const next=photoPathsOf(r).filter(p=>p!==path);await updateDoc(itemDocRef(r),{photoPaths:next,updatedAt:serverTimestamp(),updatedBy:auth.currentUser?.email||'',version:VERSION});try{await deleteObject(storageRef(storage,path))}catch(err){if(err?.code!=='storage/object-not-found')console.warn(err)}const u=urlCache.get(path);if(u){URL.revokeObjectURL(u);urlCache.delete(path)}detailPhotoIndex=0;toast('写真を削除しました')}catch(err){console.error(err);alert('写真の削除に失敗しました。')}finally{loading(false)}}
async function removeItem(id){const r=recordById(id);if(!r)return;if(!confirm(`「${titleOf(r)}」を削除しますか？\n登録写真もすべて削除します。`))return;loading(true,'項目を削除中...');try{await deleteDoc(itemDocRef(r));for(const p of photoPathsOf(r)){try{await deleteObject(storageRef(storage,p))}catch(err){if(err?.code!=='storage/object-not-found')console.warn(err)}const u=urlCache.get(p);if(u){URL.revokeObjectURL(u);urlCache.delete(p)}}if(currentId===id)closeDetail();toast('項目を削除しました')}catch(err){console.error(err);alert('削除に失敗しました。')}finally{loading(false)}}

el.loginBtn.addEventListener('click',login);el.loginPw.addEventListener('keydown',e=>{if(e.key==='Enter')login()});el.logoutBtn.addEventListener('click',()=>signOut(auth));el.searchInput.addEventListener('input',render);document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>setCategoryFilter(btn.dataset.filter)));el.showAllBtn.addEventListener('click',()=>setCategoryFilter(''));el.newItemBtn.addEventListener('click',()=>openAddItem(selectedCategoryForNew()));el.itemCancelBtn.addEventListener('click',closeItemModal);el.itemForm.addEventListener('submit',saveItem);el.initialPhotos.addEventListener('change',()=>renderLocalPreviews(el.initialPhotos,el.initialPreview));el.photoUploadInput.addEventListener('change',()=>renderLocalPreviews(el.photoUploadInput,el.photoUploadPreview));el.photoCancelBtn.addEventListener('click',closePhotoModal);el.photoUploadBtn.addEventListener('click',uploadPhotosToCurrent);el.detailClose.addEventListener('click',closeDetail);el.prevPhoto.addEventListener('click',()=>stepPhoto(-1));el.nextPhoto.addEventListener('click',()=>stepPhoto(1));el.detailAddPhotoBtn.addEventListener('click',()=>{const id=currentId;closeDetail();openPhotoModal(id)});el.editBtn.addEventListener('click',()=>{const id=currentId;closeDetail();openEditItem(id)});el.deleteBtn.addEventListener('click',()=>removeItem(currentId));document.addEventListener('keydown',e=>{if(el.detail.classList.contains('hidden'))return;if(e.key==='Escape')closeDetail();if(e.key==='ArrowLeft')stepPhoto(-1);if(e.key==='ArrowRight')stepPhoto(1)});

onAuthStateChanged(auth,async user=>{try{if(!user){showLogin();return}if(!(await allowedDevice(user))){await signOut(auth);showLogin('この端末アカウントは利用許可されていません。');return}showApp(user)}catch(err){console.error(err);showLogin('認証確認に失敗しました。')}});
</script>
